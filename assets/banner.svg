  <clipPath id="clip-0">
    <rect x="20" y="0" height="30" class="reveal-0"/>
  </clipPath>
  <text x="20" y="40" textLength="120" lengthAdjust="spacingAndGlyphs"
        class="banner-text" clip-path="url(#clip-0)">Hey there!</text>
  <clipPath id="clip-1">
    <rect x="20" y="0" height="30" class="reveal-1"/>
  </clipPath>
  <text x="20" y="40" textLength="348" lengthAdjust="spacingAndGlyphs"
        class="banner-text" clip-path="url(#clip-1)">Welcome to my GitHub profile!</text>
  <clipPath id="clip-2">
    <rect x="20" y="0" height="30" class="reveal-2"/>
  </clipPath>
  <text x="20" y="40" textLength="228" lengthAdjust="spacingAndGlyphs"
        class="banner-text" clip-path="url(#clip-2)">Take a look around!</text>
  <rect x="17" y="24" width="3" height="22" class="caret"/>
</svg>
