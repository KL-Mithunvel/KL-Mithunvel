<svg width="395" height="64" viewBox="0 0 395 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .banner-text {
      font: 600 20px 'Consolas', 'Fira Code', monospace;
      fill: #2d77dc;
    }
    .reveal-0 { width: 0; animation: reveal-0 13.220s linear infinite; }
    .reveal-1 { width: 0; animation: reveal-1 13.220s linear infinite; }
    .reveal-2 { width: 0; animation: reveal-2 13.220s linear infinite; }
    .caret {
      fill: #2d77dc;
      animation: caret-move 13.220s linear infinite, caret-blink 0.85s step-end infinite;
    }
    .sparkle {
      opacity: 0;
      transform-origin: center;
      animation-name: twinkle;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes reveal-0 {
      0.0% { width: 0px; animation-timing-function: steps(10); }
      6.8079% { width: 120px; animation-timing-function: linear; }
      16.6415% { width: 120px; animation-timing-function: steps(10); }
      20.4236% { width: 0px; animation-timing-function: linear; }
      100% { width: 0px; }
    }
    @keyframes reveal-1 {
      0% { width: 0px; }
      23.4493% { width: 0px; animation-timing-function: steps(29); }
      43.1921% { width: 348px; animation-timing-function: linear; }
      53.0257% { width: 348px; animation-timing-function: steps(29); }
      63.9939% { width: 0px; animation-timing-function: linear; }
      100% { width: 0px; }
    }
    @keyframes reveal-2 {
      0% { width: 0px; }
      67.0197% { width: 0px; animation-timing-function: steps(19); }
      79.9546% { width: 228px; animation-timing-function: linear; }
      89.7882% { width: 228px; animation-timing-function: steps(19); }
      96.9743% { width: 0px; animation-timing-function: linear; }
      100% { width: 0px; }
    }
    @keyframes caret-move {
      0.0% { transform: translateX(0px); animation-timing-function: steps(10); }
      6.8079% { transform: translateX(120px); animation-timing-function: linear; }
      16.6415% { transform: translateX(120px); animation-timing-function: steps(10); }
      20.4236% { transform: translateX(0px); animation-timing-function: linear; }
      23.4493% { transform: translateX(0px); animation-timing-function: steps(29); }
      43.1921% { transform: translateX(348px); animation-timing-function: linear; }
      53.0257% { transform: translateX(348px); animation-timing-function: steps(29); }
      63.9939% { transform: translateX(0px); animation-timing-function: linear; }
      67.0197% { transform: translateX(0px); animation-timing-function: steps(19); }
      79.9546% { transform: translateX(228px); animation-timing-function: linear; }
      89.7882% { transform: translateX(228px); animation-timing-function: steps(19); }
      96.9743% { transform: translateX(0px); animation-timing-function: linear; }
      100% { transform: translateX(0px); }
    }
    @keyframes caret-blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
  </style>
