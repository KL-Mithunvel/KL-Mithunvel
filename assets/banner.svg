<svg width="432" height="62" viewBox="0 0 432 62" xmlns="http://www.w3.org/2000/svg">
  <style>
    .banner-text {
      font: 600 22px 'Consolas', 'Fira Code', monospace;
      fill: #2d77dc;
    }
    .reveal-0 { transform: scaleX(0); animation: reveal-0 13.220s linear infinite; }
    .reveal-1 { transform: scaleX(0); animation: reveal-1 13.220s linear infinite; }
    .reveal-2 { transform: scaleX(0); animation: reveal-2 13.220s linear infinite; }
    .caret {
      fill: #2d77dc;
      animation: caret-move 13.220s linear infinite, caret-blink 0.85s step-end infinite;
    }
    .sparkle {
      opacity: 0;
      transform-origin: center;
      animation-name: twinkle;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes reveal-0 {
      0.0% { transform: scaleX(0); animation-timing-function: steps(10); }
      6.8079% { transform: scaleX(1); animation-timing-function: linear; }
      16.6415% { transform: scaleX(1); animation-timing-function: steps(10); }
      20.4236% { transform: scaleX(0); animation-timing-function: linear; }
      100% { transform: scaleX(0); }
    }
    @keyframes reveal-1 {
      0% { transform: scaleX(0); }
      23.4493% { transform: scaleX(0); animation-timing-function: steps(29); }
      43.1921% { transform: scaleX(1); animation-timing-function: linear; }
      53.0257% { transform: scaleX(1); animation-timing-function: steps(29); }
      63.9939% { transform: scaleX(0); animation-timing-function: linear; }
      100% { transform: scaleX(0); }
    }
    @keyframes reveal-2 {
      0% { transform: scaleX(0); }
      67.0197% { transform: scaleX(0); animation-timing-function: steps(19); }
      79.9546% { transform: scaleX(1); animation-timing-function: linear; }
      89.7882% { transform: scaleX(1); animation-timing-function: steps(19); }
      96.9743% { transform: scaleX(0); animation-timing-function: linear; }
      100% { transform: scaleX(0); }
    }
    @keyframes caret-move {
      0.0% { transform: translateX(144.50px); animation-timing-function: steps(10); }
      6.8079% { transform: translateX(274.50px); animation-timing-function: linear; }
      16.6415% { transform: translateX(274.50px); animation-timing-function: steps(10); }
      20.4236% { transform: translateX(144.50px); animation-timing-function: linear; }
      23.4493% { transform: translateX(21.00px); animation-timing-function: steps(29); }
      43.1921% { transform: translateX(398.00px); animation-timing-function: linear; }
      53.0257% { transform: translateX(398.00px); animation-timing-function: steps(29); }
      63.9939% { transform: translateX(21.00px); animation-timing-function: linear; }
      67.0197% { transform: translateX(86.00px); animation-timing-function: steps(19); }
      79.9546% { transform: translateX(333.00px); animation-timing-function: linear; }
      89.7882% { transform: translateX(333.00px); animation-timing-function: steps(19); }
      96.9743% { transform: translateX(86.00px); animation-timing-function: linear; }
      100% { transform: translateX(144.50px); }
    }
    @keyframes caret-blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
  </style>
